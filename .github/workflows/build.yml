name: build

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            fetch: win32-x64 win32-arm64
            jre: win32-x64
            target: --win
          - os: macos-latest
            fetch: darwin-x64 darwin-arm64
            jre: darwin-x64 darwin-arm64
            target: --mac
          - os: ubuntu-latest
            fetch: linux-x64 linux-arm64
            jre: linux-x64 linux-arm64
            target: --linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci --ignore-scripts
      - run: node node_modules/electron/install.js
      - run: node scripts/fetch-7zip.mjs ${{ matrix.fetch }}
      # JNLP 실행용 내장 JRE 8 (Windows ARM 용 배포본은 없음 → 시스템 Java 사용)
      - run: node scripts/fetch-jre.mjs ${{ matrix.jre }}
      - run: node scripts/make-icon.mjs
      - run: npx electron-vite build
      - run: npx electron-builder ${{ matrix.target }} --publish never
        env:
          # 코드 서명 인증서가 없으면 서명 없이 빌드한다
          CSC_IDENTITY_AUTO_DISCOVERY: false
      - uses: actions/upload-artifact@v4
        with:
          name: pepe-zip-${{ matrix.os }}
          path: |
            release/*.exe
            release/*.dmg
            release/*.AppImage
            release/*.deb
          if-no-files-found: error

  # 태그로 실행됐을 때만: 세 OS 결과물을 모아 GitHub 릴리즈를 만든다
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - run: ls -la dist
      - uses: softprops/action-gh-release@v2
        with:
          name: PePe Zip ${{ github.ref_name }}
          files: dist/*
          body: |
            ## 다운로드
            | OS | 파일 |
            |---|---|
            | Windows (Intel/AMD) | `PePe Zip-Setup-*-x64.exe` |
            | Windows (ARM) | `PePe Zip-Setup-*-arm64.exe` |
            | macOS (Apple Silicon) | `*-arm64.dmg` |
            | macOS (Intel) | `*-x64.dmg` |
            | Linux | `*.AppImage` 또는 `*.deb` (x86_64 / arm64) |

            ### 참고
            - 코드 서명이 없는 빌드입니다. Windows SmartScreen 경고가 뜨면 "추가 정보 → 실행"을 누르세요.
            - macOS: 처음 실행 시 앱을 우클릭 → 열기, 또는 `xattr -cr "/Applications/PePe Zip.app"`
            - Linux AppImage: `chmod +x` 후 실행
            - 압축 엔진: 7-Zip 26.03
